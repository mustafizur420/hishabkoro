# main ব্রাঞ্চে push করলেই টেস্ট চালিয়ে, সাইট বিল্ড করে GitHub Pages-এ তুলে দেয়
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # প্রতিদিন বাংলাদেশ সময় রাত ১২:০৫-এ নতুন করে বিল্ড, যাতে আজকের তারিখ আর নামাজের মাসিক টেবিল হালনাগাদ থাকে
  schedule:
    - cron: '5 18 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test calculations
        run: npm test

      # সাইট কোন ঠিকানায় চলবে GitHub থেকে জেনে নেয়:
      # ডোমেইন ছাড়া → https://<ইউজারনেম>.github.io/hishabkoro (base_path = /hishabkoro)
      # Pages সেটিংসে ডোমেইন বসালে → https://hishabkoro.com (base_path খালি)
      - id: pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # repo → Settings → Secrets and variables → Actions → Variables-এ দিলে সেটা, না দিলে GitHub-এর ঠিকানা
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || steps.pages.outputs.base_url }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_SLOT: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
